# ════════════════════════════════════════════════════════════════════════════════
# SMART RAG — Unified Docker Compose
# ════════════════════════════════════════════════════════════════════════════════
#
# All configuration is read from the root .env file (one level up from this
# file). Docker Compose only auto-loads a ".env" from your CURRENT WORKING
# DIRECTORY — it does NOT resolve one relative to this compose file, so plain
# `docker compose` invocations are easy to get wrong from either directory.
#
# ✅  Easiest: use the wrapper, which always supplies both required flags
#     no matter where you run it from:
#
#   bash scripts/compose.sh pull
#   bash scripts/compose.sh up -d
#   bash scripts/compose.sh logs -f smartrag-n8n
#
# If you'd rather call `docker compose` directly, run it from the project
# root, where the real .env lives:
#
#   cd /srv/smart-rag
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# ⚠️  If you `cd docker/` first (e.g. to poke around) and forget --env-file,
#     Compose will NOT find ../.env automatically — every variable silently
#     defaults to an empty string ("BASE_DATA_PATH variable is not set" etc.),
#     which then fails in confusing ways (e.g. "no port specified:
#     127.0.0.1::") or, worse, targets the wrong things. From inside docker/,
#     always pass the env file explicitly:
#
#   cd /srv/smart-rag/docker
#   docker compose --env-file ../.env up -d
#
# Profiles are controlled via COMPOSE_PROFILES in .env:
#   core          → always required (Flowise, Weaviate, Neo4j, PostgreSQL, Redis, MinIO, n8n)
#   observability → Langfuse + ClickHouse  (recommended for production)
#   lti           → LTI 1.3 middleware for Moodle / ILIAS
#
# ════════════════════════════════════════════════════════════════════════════════


# ── Shared Flowise base (image + restart + network + volume) ─────────────────
x-flowise-base: &flowise-base
  image: flowiseai/flowise:3.1.3
  restart: always
  networks: [smart-rag-network]
  env_file: ../.env
  volumes:
    - ${BASE_DATA_PATH}/flowise/data:/root/.flowise

# ── Flowise environment (shared between main server and worker) ───────────────
x-flowise-env: &flowise-env
  # ── Server ─────────────────────────────────────────────────────────────────
  # Resolved in .env (bootstrap applies SUBDOMAIN_PREFIX). Was
  # "https://${DOMAIN}" — the bare domain, which is not where Flowise is
  # served even without a prefix.
  APP_URL: "${FLOWISE_PUBLIC_URL}"
  NUMBER_OF_PROXIES: "1"          # increase if behind Cloudflare + nginx (set to 2)
  TRUST_PROXY: "true"
  CORS_ORIGINS: "*"
  IFRAME_ORIGINS: "*"
  FLOWISE_FILE_SIZE_LIMIT: "256mb"
  SHOW_COMMUNITY_NODES: "true"
  DISABLE_FLOWISE_TELEMETRY: "true"
  OFFLINE: "false"
  HTTP_SECURITY_CHECK: "false"    # must stay false: internal Docker hostnames would be blocked

  # ── Auth ────────────────────────────────────────────────────────────────────
  FLOWISE_USERNAME: "${FLOWISE_USERNAME}"
  FLOWISE_PASSWORD: "${FLOWISE_PASSWORD}"

  # ── Database (PostgreSQL) ────────────────────────────────────────────────────
  DATABASE_TYPE: "postgres"
  DATABASE_HOST: "smartrag-postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "flowise"
  DATABASE_USER: "${POSTGRES_USER}"
  DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
  DATABASE_SSL: "false"
  DATABASE_PATH: "/root/.flowise"

  # ── Secret storage ──────────────────────────────────────────────────────────
  SECRETKEY_STORAGE_TYPE: "local"
  SECRETKEY_PATH: "/root/.flowise"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  SALT: "${SALT}"

  # ── File storage ─────────────────────────────────────────────────────────────
  # Local, not S3. Flowise stores chat attachments and uploaded files here;
  # they are per-chatflow working data, not course content, and the course
  # documents that matter go through the ingest into Weaviate. Keeping them
  # in the object store bought nothing and made Flowise a second consumer of
  # it — one more thing to migrate, and one more place credentials had to be
  # right. The directory is already a persistent volume.
  STORAGE_TYPE: "local"
  BLOB_STORAGE_PATH: "/root/.flowise/storage"

  # ── Queue (Redis / BullMQ) ────────────────────────────────────────────────────
  MODE: "queue"
  WORKER_PORT: "5566"
  QUEUE_NAME: "flowise-queue"
  QUEUE_REDIS_EVENT_STREAM_MAX_LEN: "100000"
  WORKER_CONCURRENCY: "10"        # reduce to 2–4 on servers with limited RAM
  REMOVE_ON_AGE: "86400"
  REMOVE_ON_COUNT: "10000"
  ENABLE_BULLMQ_DASHBOARD: "true"
  REDIS_HOST: "smartrag-redis"
  REDIS_PORT: "6379"
  REDIS_AUTH: "${REDIS_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_TLS: "false"
  REDIS_TLS_ENABLED: "false"
  REDIS_KEEP_ALIVE: "true"

  # ── JWT ─────────────────────────────────────────────────────────────────────
  JWT_AUTH_TOKEN_SECRET: "${JWT_AUTH_TOKEN_SECRET}"
  JWT_REFRESH_TOKEN_SECRET: "${JWT_REFRESH_TOKEN_SECRET}"
  EXPRESS_SESSION_SECRET: "${EXPRESS_SESSION_SECRET}"
  TOKEN_HASH_SECRET: "${TOKEN_HASH_SECRET}"
  JWT_ISSUER: "SMART-RAG"
  JWT_AUDIENCE: "STUDENTS"
  JWT_TOKEN_EXPIRY_IN_MINUTES: "360"
  JWT_REFRESH_TOKEN_EXPIRY_IN_MINUTES: "43200"
  EXPIRE_AUTH_TOKENS_ON_RESTART: "true"
  INVITE_TOKEN_EXPIRY_IN_HOURS: "24"
  PASSWORD_RESET_TOKEN_EXPIRY_IN_MINS: "180"
  PASSWORD_SALT_HASH_ROUNDS: "10"

  # ── SMTP (strongly recommended — for password resets and invitations) ────────
  # SMTP_HOST/PORT/USER/PASSWORD are set by the bootstrap wizard's mail-relay
  # section — either the local Postfix relay (see scripts/install-postfix.sh,
  # gateway 172.28.92.1, see the `networks:` block at the end of this file) or
  # a directly-configured external SMTP relay. Empty SMTP_HOST disables it.
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-25}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  ALLOW_UNAUTHORIZED_CERTS: "true"
  SENDER_EMAIL: "${SMTP_SENDER_EMAIL}"

  # ── Logging & Metrics ────────────────────────────────────────────────────────
  DEBUG: "false"
  LOG_LEVEL: "info"
  LOG_PATH: "/root/.flowise/logs"
  ENABLE_METRICS: "true"
  METRICS_PROVIDER: "prometheus"
  METRICS_INCLUDE_NODE_METRICS: "true"
  METRICS_SERVICE_NAME: "SmartRAG-${COURSE_ID}"

  # ── Allowed external packages for custom tool functions ───────────────────────
  TOOL_FUNCTION_BUILTIN_DEP: "crypto,fs,path,os"
  TOOL_FUNCTION_EXTERNAL_DEP: "langfuse,neo4j-driver,moment,lodash"

  # ── Enterprise ───────────────────────────────────────────────────────────────
  FLOWISE_EE_FEATURES: "false"
  FLOWISE_EE_LICENSE_KEY: "${FLOWISE_EE_LICENSE_KEY}"


# ════════════════════════════════════════════════════════════════════════════════
# SERVICES
# ════════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  # Shared database for Flowise, n8n, and Langfuse.
  # Not exposed to host — only accessible within smart-rag-network.
  smartrag-postgres:
    profiles: [core]
    image: postgres:17.10-alpine
    container_name: smartrag-postgres
    restart: always
    env_file: ../.env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      # UTC for the same reason as smartrag-clickhouse: Langfuse does
      # not support a non-UTC store.
      TZ: "UTC"
    volumes:
      - ${BASE_DATA_PATH}/postgres/data:/var/lib/postgresql/data
      # Creates the "flowise" and "n8n" databases on first init — the image
      # only auto-creates the one named by POSTGRES_DB. See postgres-init/
      # for details. Only runs once (empty data directory); has no effect
      # on an already-initialized volume.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ── Redis ────────────────────────────────────────────────────────────────────
  # Used as BullMQ job queue (Flowise) and session store (LTI middleware).
  smartrag-redis:
    profiles: [core]
    image: redis:8.8.1-alpine
    container_name: smartrag-redis
    restart: always
    env_file: ../.env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${BASE_DATA_PATH}/redis/data:/data
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ── MinIO ────────────────────────────────────────────────────────────────────
  # S3-compatible object storage for Flowise media, Langfuse events/exports,
  # and course documents (ingest pipeline).
  #
  # Buckets created on startup:
  #   ${COURSE_ID}-rag    → course document storage (ingest pipeline)
  #   ${COURSE_ID}-media  → Flowise media uploads
  #   langfuse-events     → Langfuse event storage
  #   langfuse-media      → Langfuse media uploads
  #   langfuse-exports    → Langfuse batch exports
  #
  # On every document upload to ${COURSE_ID}-rag, MinIO fires a webhook to n8n
  # which triggers the ingest pipeline.
  # ── Garage (S3 object storage) ───────────────────────────────────────────
  # Replaces MinIO, which was archived upstream on 2026-04-24. Garage was
  # chosen after running this stack's actual S3 operations against it — put,
  # get, list, head, a 32 MB multipart round trip, a presigned URL fetched
  # without credentials, recursive delete — and then running Langfuse's own
  # client against it, which is the part documentation could not answer.
  #
  # Two differences from MinIO shape everything below:
  #
  # It needs a configuration FILE (written by the wizard, secrets in it) and
  # cannot be configured from the environment alone.
  #
  # It stores nothing until a layout assigns capacity, and its image is FROM
  # scratch — no shell, so MinIO's entrypoint-does-the-provisioning trick is
  # impossible. Layout, buckets and keys are applied from outside by
  # scripts/deploy-garage.sh, which runs the binary directly via docker exec.
  #
  # There is no web console. Garage has none, and nothing replaces it.
  smartrag-garage:
    profiles: [core]
    image: dxflrs/garage:v2.3.0
    container_name: smartrag-garage
    restart: always
    volumes:
      - ${BASE_DATA_PATH}/garage/garage.toml:/etc/garage.toml:ro
      - ${BASE_DATA_PATH}/garage/meta:/var/lib/garage/meta
      - ${BASE_DATA_PATH}/garage/data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT}:3900"
    networks: [smart-rag-network]
    # No shell in the image, so this runs the binary directly. `status` needs
    # the RPC secret from the mounted config and therefore also proves the
    # node is reachable to itself rather than merely that a process exists.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  smartrag-neo4j:
    profiles: [core]
    image: neo4j:5.26.28
    container_name: smartrag-neo4j
    restart: always
    # NOT env_file: ../.env — the neo4j image auto-translates EVERY env var
    # starting with "NEO4J_" into a config setting (e.g. server.memory...),
    # and env_file would leak NEO4J_PASSWORD (used only to build NEO4J_AUTH
    # below, not a real neo4j setting) straight into that translation. Neo4j
    # 5.x's strict config validation then rejects the resulting "PASSWORD"
    # key and crash-loops. List explicitly, only what neo4j should ever see.
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      # The heap was capped and the page cache was not — and Neo4j sizes that
      # from the memory it detects, so on a bigger host it quietly claims
      # more. Capping it makes the service's footprint a property of the
      # configuration rather than of the machine it happens to run on.
      #
      # ONE underscore before "size", unlike the heap settings above. Neo4j
      # maps NEO4J_<name> by turning "_" into "." and "__" into a literal
      # underscore, so the number of underscores encodes the real setting:
      #
      #   server.memory.heap.max_size   → NEO4J_server_memory_heap_max__size
      #   server.memory.pagecache.size  → NEO4J_server_memory_pagecache_size
      #
      # Written with two here first, which produced "server.memory.pagecache_
      # _size" — no such setting, and Neo4j refuses to start on an unknown
      # one rather than ignoring it. That strictness is why this was a
      # crash-loop on the next install and not a silently uncapped cache.
      NEO4J_server_memory_pagecache_size: "512m"
      TZ: "${TZ}"
    volumes:
      - ${BASE_DATA_PATH}/neo4j/data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT}:7687"
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s


  # ── Weaviate ─────────────────────────────────────────────────────────────────
  # Vector database for RAG retrieval, chat memory, and user memory.
  # Schema is initialised by scripts/init-weaviate.sh after first start.
  #
  # Reranker module:
  #   Default: reranker-cohere (uses RERANKER_API_KEY, no local compute needed)
  #   Alternative: comment out RERANKER_COHERE_APIKEY and change ENABLE_MODULES
  #   to "reranker-transformers" and set RERANKER_INFERENCE_API to your endpoint.
  #   Set ENABLE_MODULES="" to disable reranking entirely.
  smartrag-weaviate:
    profiles: [core]
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.6
    container_name: smartrag-weaviate
    restart: always
    env_file: ../.env
    command:
      - --host
      - 0.0.0.0
      - --port
      - "${WEAVIATE_HTTP_PORT}"
      - --scheme
      - http
    environment:
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "smartrag"
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "smartrag-weaviate"
      # Reranker: cohere (default) — change to reranker-transformers for custom endpoint
      ENABLE_MODULES: "reranker-cohere"
      RERANKER_COHERE_APIKEY: "${RERANKER_API_KEY}"
      # Uncomment for custom/local reranker:
      # ENABLE_MODULES: "reranker-transformers"
      # RERANKER_INFERENCE_API: "${RERANKER_BASE_URL}"
      TZ: "${TZ}"
    volumes:
      - ${BASE_DATA_PATH}/weaviate/data:/var/lib/weaviate
    ports:
      - "127.0.0.1:${WEAVIATE_HTTP_PORT}:${WEAVIATE_HTTP_PORT}"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT}:50051"
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WEAVIATE_HTTP_PORT}/v1/.well-known/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ── Docling (document conversion) ───────────────────────────────────────────
  # Self-hosted PDF/DOCX/PPTX/HTML/image → Markdown conversion + OCR for the
  # ingest pipeline (n8n/workflows-ingest/). CPU-only image, deliberately: this
  # project has no GPU dependency anywhere else, and Docling's own pipeline
  # runs fine on CPU (slower than with a GPU, not blocked by its absence).
  # Internal-only — no host port mapping, only n8n's ingest workflow calls it
  # over the Docker network.
  #
  # No data volume: confirmed from the upstream Containerfile that the
  # layout/table/OCR models (layout, tableformer, picture_classifier,
  # rapidocr, easyocr) are downloaded and baked into the image at BUILD time
  # (docling-tools models download → DOCLING_SERVE_ARTIFACTS_PATH), not
  # lazily on first request — nothing to persist across restarts.
  smartrag-docling:
    profiles: [core]
    image: ghcr.io/docling-project/docling-serve-cpu:v1.29.0
    container_name: smartrag-docling
    restart: always
    # The one service whose peak is driven by what a user uploads. It sits at
    # roughly 800 MB idle with its models loaded, and a large scanned document
    # with many figures is what multiplies that. Unlimited, a single upload
    # can take the host down with it; limited, a runaway conversion costs that
    # one document and the container restarts.
    #
    # Deliberately generous rather than tight: killing a conversion that would
    # have finished is its own failure. 4 GB fits the documented 8 GB minimum
    # alongside everything else.
    mem_limit: 4g
    environment:
      DOCLING_DEVICE: "cpu"
      TZ: "${TZ}"
    expose: ["5001"]
    networks: [smart-rag-network]
    healthcheck:
      # python3, not curl/wget: this is a python-312-c9s-based image whose
      # os-packages.txt (tesseract/leptonica/glib2/...) doesn't list either
      # HTTP CLI tool, and unlike every other service's healthcheck in this
      # file, that couldn't be confirmed present without a running Docker
      # daemon to inspect the actual image — python3 is guaranteed (it's
      # the whole runtime docling-serve itself runs on).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s


  # ── Markdown Cleaner ─────────────────────────────────────────────────────────
  # Thin FastAPI wrapper around the `markdowncleaner` PyPI package (MIT,
  # https://github.com/josk0/markdowncleaner) — strips references/footnotes/
  # copyright-notice sections and fixes PDF-conversion artifacts before a
  # Docling-converted document is chunked. Self-hosted (markdowncleaner/ in
  # this repo) rather than an external dependency — verified against the
  # original deployment's actual running container, not reconstructed from
  # guesswork. Internal-only, same reasoning as smartrag-docling above.
  smartrag-markdowncleaner:
    profiles: [core]
    build:
      context: ../markdowncleaner
      dockerfile: Dockerfile
    container_name: smartrag-markdowncleaner
    restart: always
    environment:
      TZ: "${TZ}"
    expose: ["8000"]
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s


  # ── Flowise (main server) ─────────────────────────────────────────────────────
  # AI agent orchestration platform. Hosts all course agents as AgentFlows.
  # After first start: import agents from flowise/agents/ via Flowise UI.
  # See docs/setup/04-flowise-agents.md
  smartrag-flowise:
    <<: *flowise-base
    profiles: [core]
    container_name: smartrag-flowise
    environment:
      # UTC, and for a reason that is not the one above. Flowise supplies the
      # timestamp on every Langfuse trace it emits, and it formats local time
      # while labelling it "Z": measured here, a conversation at 08:20:52 UTC
      # arrived as 10:20:52Z. Fixing ClickHouse removed a second, separate
      # two-hour shift on top of this one; this is the remaining half, and it
      # can only be fixed at the producer.
      #
      # The cost is that Flowise's own UI shows UTC. That is the smaller
      # price: a timestamp read once in Flowise's chat list against every
      # trace, cost figure and time filter in Langfuse being wrong.
      TZ: "UTC"
      <<: *flowise-env
    ports:
      - "127.0.0.1:${FLOWISE_PORT}:3000"
    depends_on:
      smartrag-postgres:
        condition: service_healthy
      smartrag-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s


  # ── Flowise (queue worker) ────────────────────────────────────────────────────
  # Processes agent jobs from the Redis BullMQ queue.
  # Must run the same image version as smartrag-flowise at all times.
  smartrag-flowise-worker:
    <<: *flowise-base
    profiles: [core]
    container_name: smartrag-flowise-worker
    entrypoint: ["flowise", "worker"]
    expose: ["5566"]
    environment:
      # UTC for the same reason as smartrag-flowise: it is the producer
      # of the timestamps on Langfuse traces.
      TZ: "UTC"
      <<: *flowise-env
    depends_on:
      smartrag-flowise:
        condition: service_healthy


  # ── Content Admin GUI ─────────────────────────────────────────────────────────
  # Course-content authoring: fill in the Flowise agent templates' course-
  # specific placeholders and import them, plus a guided path to seed the
  # Neo4j concept graph. Deliberately separate from scripts/admin.sh (the
  # infrastructure TUI) — this only ever talks to Flowise/Neo4j over the
  # internal Docker network, never Docker socket or host filesystem, so a
  # compromised GUI can't escalate to host control.
  #
  # .env is bind-mounted READ-WRITE (not env_file:) because this app needs to
  # write back to it (FLOWISE_API_KEY, CHATFLOW_AGENT0X, its own login) — see
  # content-admin/env_file.py. No caching on read, so it always sees the
  # latest state, including edits made via scripts/admin.sh's config menu.
  smartrag-content-admin:
    profiles: [core]
    build:
      context: ../content-admin
      dockerfile: Dockerfile
    container_name: smartrag-content-admin
    restart: always
    volumes:
      - ../.env:/app/.env
      - ${BASE_DATA_PATH}/content-admin:/app/data
      - ../flowise/agents:/app/flowise/agents:ro
    environment:
      SMARTRAG_ENV_PATH: "/app/.env"
      SMARTRAG_SLOTS_PATH: "/app/data/slots.json"
      SMARTRAG_TEMPLATES_DIR: "/app/flowise/agents"
      TZ: "${TZ}"
    ports:
      - "127.0.0.1:${CONTENT_ADMIN_PORT:-3002}:5000"
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s


  # ── n8n ──────────────────────────────────────────────────────────────────────
  # Automation platform running background pipelines:
  #   • Chat history sync (PostgreSQL → Weaviate, every 5 min)
  #   • User memory summary (per-student learning profile)
  #   • Document ingest trigger (MinIO upload → Weaviate)
  # After first start: import and activate workflows from n8n/workflows/.
  # See docs/setup/07-first-login.md
  smartrag-n8n:
    profiles: [core]
    image: n8nio/n8n:1.123.67
    container_name: smartrag-n8n
    restart: always
    env_file: ../.env
    environment:
      N8N_HOST: "${N8N_HOSTNAME}"
      # PINNED, not ${N8N_PORT} — n8n's own app reads this exact variable
      # name to choose its INTERNAL listen port. N8N_PORT in .env is a
      # completely different thing (the HOST-side port binding below, which
      # the wizard may resolve away from 5678 on a port conflict) — but
      # since this service uses env_file: ../.env, that HOST-side value
      # would otherwise leak in and make n8n listen on the wrong port
      # internally, breaking both the Docker port mapping's container-side
      # target and this container's own healthcheck. Keep this fixed at
      # 5678 to match the container-side target in `ports:` below.
      N8N_PORT: "5678"
      # n8n deprecated running without task runners; set explicitly to avoid
      # the startup warning and stay ready for when it becomes mandatory.
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROTOCOL: "https"
      # NOT N8N_TRUST_PROXY — no such setting exists. n8n reads
      # @Env('N8N_PROXY_HOPS') (packages/@n8n/config), a COUNT of reverse
      # proxies, defaulting to 0. With the wrong name, Express kept
      # trust-proxy off and logged a ValidationError on every request that
      # carried X-Forwarded-For: rate limiting was then keyed on the proxy's
      # address rather than the client's, so one visitor could exhaust the
      # limit for everyone. Found in a live log, which is also what finally
      # proved the name wrong — a source search had been inconclusive.
      #
      # 1 in both deployment modes: nginx in domain mode, `tailscale serve`
      # in tailscale mode. Exactly one hop either way.
      N8N_PROXY_HOPS: "1"
      # n8n calls WEBHOOK_URL deprecated in its own config: "Successor to
      # the deprecated `WEBHOOK_URL`" on @Env('N8N_WEBHOOK_URL'). The old
      # spelling is still honoured today and will not be forever, and a
      # webhook base URL is not something to discover has stopped applying.
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL}"
      N8N_PATH: "/"
      N8N_PAYLOAD_SIZE_MAX: "256"
      N8N_AI_TIMEOUT_MAX: "3600000"
      EXECUTIONS_TIMEOUT: "14400"
      EXECUTIONS_TIMEOUT_MAX: "14400"
      N8N_RUNNERS_TASK_TIMEOUT: "1800"
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: "300"
      NODE_OPTIONS: "--max-old-space-size=4096"
      # pdf-lib was allowlisted here and is neither installed nor used by any
      # workflow, so it only produced a warning on every start. Removed.
      NODE_FUNCTION_ALLOW_BUILTIN: "http"
      # Pinned deliberately. n8n warns that this default flips from false to
      # true in a future version, and our workflows read $env at 24 places —
      # the Weaviate collection name, the embedding key and model, the course
      # id, the LLM credentials. When the default flips, a plain image bump
      # would break the entire ingest with nobody having changed anything.
      #
      # It does keep the container's environment readable from Code nodes,
      # which is a real trade-off. The cleaner alternative is to move those
      # values into n8n credentials and reference them per node; that is a
      # rework of five workflows, not a setting, and is worth doing on its
      # own rather than under time pressure from an upstream default change.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # We ship no Git-node workflow, so the stricter behaviour costs nothing
      # and silences the second startup deprecation.
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      # /home/node/.n8n/config holds the encryption key that every stored
      # credential — S3, SMTP, the LLM keys — is encrypted with, and n8n
      # creates it 0644: readable by every user in the container. n8n warns
      # about this and will enforce 0600 itself in a future version; asking
      # for that now means the permissions are right from the first start
      # rather than whenever the image is next bumped.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_USER_MANAGEMENT_JWT_SECRET: "${N8N_USER_MANAGEMENT_JWT_SECRET}"
      # NOT N8N_DB_*. n8n's database settings carry no N8N_ prefix — see
      # packages/@n8n/config/src/configs/database.config.ts, where the
      # decorators are @Env('DB_TYPE') and @Env('DB_POSTGRESDB_*'), and
      # DB_TYPE defaults to 'sqlite'. Setting the prefixed names configures
      # nothing: n8n ignored all five and quietly ran on SQLite instead, so
      # the Postgres database sat empty while 192 MB of workflows,
      # credentials and execution history accumulated in a file inside the
      # volume. Nothing failed — which is why it went unnoticed until an
      # execution query found no such table.
      #
      # The keys in .env stay N8N_DB_* on purpose: that file namespaces by
      # service, and renaming them would mean a migration for every existing
      # installation. Only the name the container receives has to be the one
      # n8n reads.
      DB_TYPE: "${N8N_DB_TYPE}"
      DB_POSTGRESDB_HOST: "smartrag-postgres"
      DB_POSTGRESDB_USER: "${POSTGRES_USER}"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRESDB_DATABASE: "n8n"
      GENERIC_TIMEZONE: "${TZ}"
      TZ: "${TZ}"
      # ── SMTP (strongly recommended — for password resets and invitations) ──
      # Same relay as Flowise/Langfuse, see SMTP_* in .env. N8N_EMAIL_MODE is
      # set to "smtp" by the wizard only when a relay was actually configured.
      N8N_EMAIL_MODE: "${N8N_EMAIL_MODE:-}"
      N8N_SMTP_HOST: "${SMTP_HOST:-}"
      N8N_SMTP_PORT: "${SMTP_PORT:-25}"
      N8N_SMTP_USER: "${SMTP_USER:-}"
      N8N_SMTP_PASS: "${SMTP_PASSWORD:-}"
      N8N_SMTP_SENDER: "${SMTP_SENDER_EMAIL}"
      N8N_SMTP_SSL: "${SMTP_SECURE:-false}"
    volumes:
      - ${BASE_DATA_PATH}/n8n/data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    networks: [smart-rag-network]
    depends_on:
      smartrag-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      # 60s wasn't enough on first-ever start: a fresh "n8n" database runs
      # every migration n8n has ever shipped (dozens, live-observed taking
      # several minutes), and each failed check during that time counts
      # against `retries` — locking in "unhealthy" before the app is even
      # done initializing, even though it comes up fine moments later.
      # 180s then ALSO proved too short on a live, real-world-loaded server
      # (all other containers starting simultaneously, competing for
      # CPU/disk I/O) — bumped again to 300s. If you change this, also bump
      # the matching per-service timeout for smartrag-n8n in
      # start-services.sh's wait_for_healthy loop (keep it comfortably above
      # start_period + retries*interval = 300s + 100s = 400s here, or this
      # script will give up before Docker's own healthcheck ever would).
      start_period: 300s


  # ════════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY profile — Langfuse + ClickHouse
  # Enable: add "observability" to COMPOSE_PROFILES in .env
  # ════════════════════════════════════════════════════════════════════════════

  # ── ClickHouse ───────────────────────────────────────────────────────────────
  # Analytics backend for Langfuse.
  # Must start before Langfuse (depends_on).
  smartrag-clickhouse:
    profiles: [observability]
    image: clickhouse/clickhouse-server:26.7.1.1315
    container_name: smartrag-clickhouse
    restart: always
    # ClickHouse sizes its caches from the memory it believes it has, and
    # recent versions read the cgroup limit rather than the host's total — so
    # a limit here is also what tells it how much it may use. Without one it
    # plans against all 16 GB of a machine it shares with twelve other
    # services. Observed at ~580 MB serving one course.
    mem_limit: 2g
    env_file: ../.env
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      # UTC, not the installation's timezone. Langfuse does not support a
      # non-UTC ClickHouse or Postgres: its own documentation says queries
      # then return "incorrect or empty results"
      # (langfuse.com/self-hosting/deployment/infrastructure/clickhouse,
      # langfuse.com/faq/all/self-hosting-timezone-errors). Observed here as
      # trace timestamps two hours ahead of the server clock.
      #
      # Note this has to be set in `environment:`, not left to env_file:
      # every service using env_file inherits TZ from .env, which is how
      # Flowise ended up in Europe/Berlin without a line naming it. An
      # `environment:` entry wins over env_file, so this pin holds.
      #
      # Only the stores and the Langfuse services are pinned. n8n, the
      # Content Admin and the rest keep ${TZ}, where a local timestamp in a
      # log is what an operator wants.
      TZ: "UTC"
    volumes:
      - ${BASE_DATA_PATH}/clickhouse/data:/var/lib/clickhouse
    networks: [smart-rag-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144


  # ── Langfuse (web) ────────────────────────────────────────────────────────────
  # LLM observability dashboard — traces all agent calls with costs and latencies.
  smartrag-langfuse-web:
    profiles: [observability]
    image: langfuse/langfuse:${LANGFUSE_IMAGE_TAG}
    container_name: smartrag-langfuse-web
    restart: always
    env_file: ../.env
    environment:
      PORT: "${LANGFUSE_PORT}"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      DATABASE_URL: "${DATABASE_URL}"
      CLICKHOUSE_URL: "${CLICKHOUSE_URL}"
      CLICKHOUSE_MIGRATION_URL: "${CLICKHOUSE_MIGRATION_URL}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_CLUSTER_ENABLED: "${CLICKHOUSE_CLUSTER_ENABLED}"
      # UTC for the same reason as smartrag-clickhouse: Langfuse does
      # not support a non-UTC store.
      TZ: "UTC"
    volumes:
      - ${BASE_DATA_PATH}/langfuse/web:/app/data
    ports:
      - "127.0.0.1:${LANGFUSE_PORT}:${LANGFUSE_PORT}"
    networks: [smart-rag-network]
    # The Langfuse image ships no HEALTHCHECK of its own, so without this the
    # installer waits out its whole timeout for a status that never arrives.
    # node is guaranteed present (it is what runs the server) and has a global
    # fetch, so this needs neither curl nor wget in the image. Reading PORT
    # from the environment rather than interpolating ${LANGFUSE_PORT} keeps
    # the check correct even if compose interpolation is bypassed.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Langfuse applies its ClickHouse and Postgres migrations on first boot;
      # on a machine this size that is minutes, not seconds.
      start_period: 180s
    depends_on:
      smartrag-postgres:
        condition: service_healthy
      smartrag-clickhouse:
        condition: service_healthy


  # ── Langfuse (worker) ─────────────────────────────────────────────────────────
  # Background worker processing traces, ingestion, and batch exports.
  smartrag-langfuse-worker:
    profiles: [observability]
    image: langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG}
    container_name: smartrag-langfuse-worker
    restart: always
    env_file: ../.env
    environment:
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      DATABASE_URL: "${DATABASE_URL}"
      CLICKHOUSE_URL: "${CLICKHOUSE_URL}"
      CLICKHOUSE_MIGRATION_URL: "${CLICKHOUSE_MIGRATION_URL}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_CLUSTER_ENABLED: "${CLICKHOUSE_CLUSTER_ENABLED}"
      # UTC for the same reason as smartrag-clickhouse: Langfuse does
      # not support a non-UTC store.
      TZ: "UTC"
    volumes:
      - ${BASE_DATA_PATH}/langfuse/worker:/app/data
    networks: [smart-rag-network]
    depends_on:
      smartrag-postgres:
        condition: service_healthy
      smartrag-clickhouse:
        condition: service_healthy


  # ════════════════════════════════════════════════════════════════════════════
  # LTI profile — Moodle / ILIAS integration
  # Enable: add "lti" to COMPOSE_PROFILES in .env
  # Configure agents: lti-middleware/config/agents.json (after Flowise setup)
  # Full setup guide: docs/setup/06-lms-lti.md
  # ════════════════════════════════════════════════════════════════════════════

  # ── LTI Middleware ────────────────────────────────────────────────────────────
  # Flask application handling LTI 1.3 login/launch flow from Moodle or ILIAS.
  # Validates LTI launch, creates a session token, and redirects to Flowise chat.
  # Chatflow UUIDs (CHATFLOW_AGENT01–14) must be set in .env after Flowise setup.
  smartrag-lti:
    profiles: [lti]
    build:
      context: ../lti-middleware
      dockerfile: Dockerfile
    container_name: smartrag-lti
    restart: unless-stopped
    env_file: ../.env
    environment:
      FLOWISE_HOST: "${FLOWISE_PUBLIC_URL}"
      LMS_URL: "${LMS_URL:-https://lms.example.com}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@smartrag-redis:${REDIS_PORT}"
      SESSION_TTL_SEC: "3600"
      CONSENT_TTL_SEC: "86400"
      LTI_CONFIG_DIR:  "/app/config"
      LTI_SESSION_SECRET: "${LTI_SESSION_SECRET}"
      LTI_COOKIE_NAME: "smartrag_lti_session"
      TZ: "${TZ}"
      # Flowise chatflow UUIDs — set in .env after deploying agents in Flowise
      # Find UUIDs in Flowise UI under each agent's "API" tab
      CHATFLOW_AGENT01: "${CHATFLOW_AGENT01}"
      CHATFLOW_AGENT02: "${CHATFLOW_AGENT02}"
      CHATFLOW_AGENT03: "${CHATFLOW_AGENT03}"
      CHATFLOW_AGENT04: "${CHATFLOW_AGENT04}"
      CHATFLOW_AGENT05: "${CHATFLOW_AGENT05}"
      CHATFLOW_AGENT06: "${CHATFLOW_AGENT06}"
      CHATFLOW_AGENT07: "${CHATFLOW_AGENT07}"
      CHATFLOW_AGENT08: "${CHATFLOW_AGENT08}"
      CHATFLOW_AGENT09: "${CHATFLOW_AGENT09}"
      CHATFLOW_AGENT10: "${CHATFLOW_AGENT10}"
      CHATFLOW_AGENT11: "${CHATFLOW_AGENT11}"
      CHATFLOW_AGENT12: "${CHATFLOW_AGENT12}"
      CHATFLOW_AGENT13: "${CHATFLOW_AGENT13}"
      CHATFLOW_AGENT14: "${CHATFLOW_AGENT14}"
    ports:
      - "127.0.0.1:${LTI_PORT:-10088}:10088"
    volumes:
      - ../lti-middleware/config:/app/config:ro
    networks:
      - smart-rag-network
      - proxy-network
    depends_on:
      smartrag-redis:
        condition: service_healthy


# ════════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ════════════════════════════════════════════════════════════════════════════════

networks:
  # Subnet pinned (not auto-assigned) so the gateway IP is a known constant —
  # scripts/install-postfix.sh restricts Postfix's mail relay to exactly this
  # range (see mynetworks in that script) without waiting for this network to
  # exist. If 172.28.92.0/24 collides with another Docker network already on
  # this host, `docker compose up` will fail loudly with an address-pool error
  # — change the subnet/gateway here (and the two IPs in install-postfix.sh
  # and config-wizard.sh's ask_mail_config) to a free range and retry.
  smart-rag-network:
    name: smart-rag-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.92.0/24
          gateway: 172.28.92.1

  # proxy-network is the network shared with nginx (reverse proxy).
  # It is declared external because nginx manages it independently.
  # Create before first start: docker network create proxy-network
  proxy-network:
    name: proxy-network
    external: true
