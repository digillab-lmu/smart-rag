{% extends "base.html" %}
{% block title %}{{ t('login_title') }} — {{ t('app_name') }} {{ t('app_subtitle') }}{% endblock %}
{% block content %}
<h1>{{ t('login_heading') }}</h1>
<form method="post">
  <label for="username">{{ t('login_username') }}</label>
  <input type="text" id="username" name="username" required autofocus>

  <label for="password">{{ t('login_password') }}</label>
  <input type="password" id="password" name="password" required>

  <button type="submit">{{ t('login_submit') }}</button>
</form>
{% if mail_available %}
<p style="margin-top:1rem;"><a href="{{ url_for('forgot_password') }}">{{ t('login_forgot') }}</a></p>
{% endif %}
{% endblock %}
