{% extends "base.html" %}
{% block title %}{{ t('setup_title') }} — {{ t('app_name') }} {{ t('app_subtitle') }}{% endblock %}
{% block content %}
<h1>{{ t('setup_heading') }}</h1>
<p class="note">{{ t('setup_intro') }}</p>
<form method="post">
  <label for="username">{{ t('setup_username') }}</label>
  <input type="text" id="username" name="username" required autofocus>

  <label for="password">{{ t('setup_password') }}</label>
  <input type="password" id="password" name="password" minlength="12" required>

  <label for="confirm">{{ t('setup_confirm') }}</label>
  <input type="password" id="confirm" name="confirm" minlength="12" required>

  <button type="submit">{{ t('setup_submit') }}</button>
</form>
{% endblock %}
