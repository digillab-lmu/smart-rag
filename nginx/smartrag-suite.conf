    location / { return 301 https://$host$request_uri; }
}


# ══════════════════════════════════════════════════════════════════════════════
# LTI Middleware — Moodle / ILIAS integration (optional)
# Only needed if COMPOSE_PROFILES includes "lti".
# ══════════════════════════════════════════════════════════════════════════════
server {
    server_name lti.YOUR_DOMAIN;

    listen 443 ssl; listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # LTI login and launch endpoints
    location /lti/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chatbot page — served inside LMS iframe
    # Content-Security-Policy allows embedding from your LMS domain.
    # Replace YOUR_LMS_DOMAIN with your Moodle/ILIAS URL.
    location /chat/ {
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "frame-ancestors https://YOUR_LMS_DOMAIN" always;
    }

    location /consent/ {
        proxy_pass http://127.0.0.1:10088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:10088;
        access_log off;
    }

    location / { return 404; }
}

server {
    listen 80; listen [::]:80;
    server_name lti.YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}
