# ════════════════════════════════════════════════════════════════════════════════
# SMART RAG — nginx Reverse Proxy Configuration
# ════════════════════════════════════════════════════════════════════════════════
#
# This file is a TEMPLATE. The placeholder YOUR_DOMAIN is replaced by
# scripts/bootstrap.sh using your configured DOMAIN value.
#
# Subdomains required (all must resolve to this server's IP):
#   smart-rag.YOUR_DOMAIN   → Flowise (AI agents, student-facing)
#   n8n.YOUR_DOMAIN         → n8n automation (admin only)
#   langfuse.YOUR_DOMAIN    → Langfuse observability (admin only, optional)
#   minio.YOUR_DOMAIN       → MinIO console (admin only)
#   s3.YOUR_DOMAIN          → MinIO S3 API (used by services internally)
#   lti.YOUR_DOMAIN         → LTI middleware (optional, if Moodle/ILIAS used)
#
# SSL certificates: obtained by bootstrap.sh via Let's Encrypt (certbot).
# ════════════════════════════════════════════════════════════════════════════════


# ── CORS origin map ───────────────────────────────────────────────────────────
# Add your LMS URL (Moodle/ILIAS) to allow cross-origin requests.
map $http_origin $cors_origin {
    default "";
    ~^https://(YOUR_DOMAIN|n8n\.YOUR_DOMAIN|moodle\.YOUR_LMS_DOMAIN)$ $http_origin;
}
map "" $cors_allow_methods { default "GET, POST, PUT, DELETE, OPTIONS"; }
map "" $cors_allow_headers { default "Authorization, Content-Type, X-Experience-API-Version, If-Match, If-None-Match, X-Requested-With, Accept"; }


# ══════════════════════════════════════════════════════════════════════════════
# Flowise — AI agent interface (student-facing)
# ══════════════════════════════════════════════════════════════════════════════
server {
    server_name smart-rag.YOUR_DOMAIN;
    client_max_body_size 50M;

    # SSE: streaming responses (Flowise prediction endpoints)
    location ~* ^/api/v1/(prediction|chatflow-streaming)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80; listen [::]:80;
    server_name smart-rag.YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}


# ══════════════════════════════════════════════════════════════════════════════
# n8n — automation pipelines (admin only)
# Handles large PDF uploads and long-running AI ingest jobs.
# ══════════════════════════════════════════════════════════════════════════════
server {
    server_name n8n.YOUR_DOMAIN;
    client_max_body_size 256M;
    client_body_buffer_size 64M;

    proxy_connect_timeout 900s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
    client_body_timeout   900s;
    proxy_request_buffering off;
    proxy_buffering off;

    # Webhooks (MinIO upload triggers, external integrations)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # SSE / MCP real-time events
    location /mcp/ {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_buffering off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    listen 443 ssl; listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80; listen [::]:80;
    server_name n8n.YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}


# ══════════════════════════════════════════════════════════════════════════════
# Langfuse — LLM observability (optional, admin only)
# Only needed if COMPOSE_PROFILES includes "observability".
# ══════════════════════════════════════════════════════════════════════════════
server {
    server_name langfuse.YOUR_DOMAIN;
    client_max_body_size 50M;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrag-YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80; listen [::]:80;
    server_name langfuse.YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}


